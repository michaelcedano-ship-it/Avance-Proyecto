<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi calendario de tareas</title>
<!-- Estilos CSS en la carpeta css -->
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <h1>📅 Mi calendario de tareas</h1>
  <p class="sub">Organiza tus tareas pendientes en el calendario.</p>
  <div class="grid">
    <section class="card">
      <div class="head"><button id="prev" aria-label="Mes anterior">‹</button><b id="mes"></b><button id="next" aria-label="Mes siguiente">›</button></div>
      <div class="dow"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="days" id="days"></div>
    </section>
    <section class="card">
      <div class="head"><b id="fecha"></b><button id="hoy">Hoy</button></div>
      <div id="aviso"></div>
      <form id="f">
        <input type="text" id="titulo" placeholder="Ej: Preparar exposición de biología" required maxlength="120">
        <div class="row"><input type="date" id="dia" required><input type="time" id="hora"></div>
        <button class="pri" type="submit">Agregar tarea</button>
      </form>
      <div id="lista"></div>
    </section>
  </div>
</div>

<!-- Lógica JavaScript en la carpeta js (con 'defer' para evitar errores al cargar) -->
<script src="js/app.js" defer></script>
</body>
</html>
